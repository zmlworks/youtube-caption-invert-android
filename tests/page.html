<!DOCTYPE html><html><head><meta charset="utf-8"><style>
#movie_player{position:relative;width:854px;height:480px;background:#456;overflow:hidden}
video{width:100%;height:100%;display:block;background:#789}
.ytp-caption-window-container{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none}
.caption-window{position:absolute;line-height:normal;z-index:40}
.caption-window.ytp-caption-window-bottom{margin-bottom:61px;transition:margin-bottom .25s cubic-bezier(0,0,.2,1),margin-top .25s cubic-bezier(0,0,.2,1)}
.ytp-autohide .caption-window.ytp-caption-window-bottom{margin-bottom:0;transition:margin-bottom .1s cubic-bezier(.4,0,1,1),margin-top .1s cubic-bezier(.4,0,1,1)}
</style></head><body>
<div id="movie_player" class="html5-video-player">
 <div class="html5-video-container"><video class="video-stream html5-main-video"></video></div>
 <div class="ytp-caption-window-container" id="ytp-caption-window-container"></div>
 <div class="ytp-chrome-bottom" style="position:absolute;width:0;height:0;overflow:hidden"><button class="ytp-subtitles-button ytp-button" aria-pressed="true"></button></div>
</div>
<script>
const SEG = (t, fs) => `<span class="captions-text" style="overflow-wrap: normal; display: block;"><span class="caption-visual-line" style="display: block;"><span class="ytp-caption-segment" style="display: inline-block; white-space: pre-wrap; background: rgba(8, 8, 8, 0.75); font-size: ${fs}px; color: rgb(255, 255, 255); fill: rgb(255, 255, 255); font-family: Arial, sans-serif;">${t}</span></span></span>`;
window.ytShow = function (text, fs) {
  const c = document.getElementById("ytp-caption-window-container");
  c.textContent = "";
  const w = document.createElement("div");
  w.className = "caption-window ytp-caption-window-bottom";
  w.id = "caption-window-1";
  const width = Math.round(text.length * fs * 0.55);
  w.setAttribute("style", `touch-action: none; text-align: center; overflow: hidden; left: 50%; width: ${width}px; height: ${Math.round(fs*1.3)}px; margin-left: -${width/2}px; bottom: 2%;`);
  w.innerHTML = SEG(text, fs);
  c.appendChild(w);
  return w;
};
window.ytClear = function () { document.getElementById("ytp-caption-window-container").textContent = ""; };
</script>
</body></html>
